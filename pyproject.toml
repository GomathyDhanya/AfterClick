[project]
name = "afterclick"
version = "0.1.0"
description = "Deterministic browser recovery experiments"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "playwright>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1"]
research = [
    "matplotlib>=3.10,<3.11",
    "scikit-learn>=1.7,<1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterclick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real Chromium and PostgreSQL tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
